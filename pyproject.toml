[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-track"
version = "0.1.0"
description = "Reference implementation for Regret Bounds for Restless Rising Concave Bandits via Switching"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["rc_track*"]
